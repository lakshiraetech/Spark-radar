# Base44 development environment for Spark Radar (Next.js + Supabase).
# Runs everything from the cloned source with live reload; data lives in a
# Postgres volume. Only the web app (host port 3000) is publicly reachable.
name: spark-radar

x-supabase-env: &supabase-env
  # Local-only development JWT secret shared by GoTrue and PostgREST.
  SUPABASE_JWT_SECRET: spark-radar-base44-local-dev-jwt-secret-0123456789abcdef

x-gotrue-env: &gotrue-env
  GOTRUE_API_HOST: 0.0.0.0
  GOTRUE_API_PORT: "9999"
  PORT: "9999"
  GOTRUE_API_EXTERNAL_URL: http://gateway:8000/auth/v1
  API_EXTERNAL_URL: http://gateway:8000/auth/v1
  GOTRUE_DB_DRIVER: postgres
  GOTRUE_DB_DATABASE_URL: postgres://supabase_admin:postgres@db:5432/postgres
  GOTRUE_DB_NAMESPACE: auth
  GOTRUE_SITE_URL: http://localhost:3000
  GOTRUE_URI_ALLOW_LIST: http://localhost:3000
  GOTRUE_JWT_SECRET: spark-radar-base44-local-dev-jwt-secret-0123456789abcdef
  GOTRUE_JWT_EXP: "3600"
  GOTRUE_JWT_AUD: authenticated
  GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
  GOTRUE_JWT_ADMIN_ROLES: service_role
  GOTRUE_DISABLE_SIGNUP: "false"
  GOTRUE_MAILER_AUTOCONFIRM: "true"
  GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
  GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
  GOTRUE_SMS_AUTOCONFIRM: "true"
  GOTRUE_LOG_LEVEL: info

services:
  db:
    image: supabase/postgres:15.19.0.016
    restart: on-failure
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-bootstrap:
    image: supabase/postgres:15.19.0.016
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/base44/db-bootstrap.sh"]
    environment:
      PGHOST: db
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./.base44/db-bootstrap.sh:/base44/db-bootstrap.sh:ro
    restart: "no"

  db-setup:
    image: supabase/postgres:15.19.0.016
    depends_on:
      db:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    entrypoint: ["sh", "/base44/db-setup.sh"]
    environment:
      PGHOST: db
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./supabase:/supabase:ro
      - ./.base44/db-setup.sh:/base44/db-setup.sh:ro
    restart: "no"

  auth-migrate:
    image: supabase/gotrue:v2.177.0
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    command: ["auth", "migrate"]
    environment: *gotrue-env
    restart: "no"

  auth:
    image: supabase/gotrue:v2.177.0
    restart: on-failure
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    command: ["auth", "serve"]
    environment: *gotrue-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9999/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: on-failure
    depends_on:
      db-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: spark-radar-base44-local-dev-jwt-secret-0123456789abcdef
      PGRST_SERVER_PORT: "3000"
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_LOG_LEVEL: info
    # The PostgREST image is distroless (no shell/probe binary); the gateway
    # healthcheck below probes /rest/v1/ and covers this service.

  gateway:
    image: nginx:alpine
    restart: on-failure
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    volumes:
      - ./.base44/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8000/auth/v1/health >/dev/null && wget -qO- http://127.0.0.1:8000/rest/v1/ >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    depends_on:
      gateway:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      # Internal Supabase-compatible API (auth + REST) reached inside the
      # Docker network; the browser never calls it directly.
      NEXT_PUBLIC_SUPABASE_URL: http://gateway:8000
      SUPABASE_JWT_SECRET: spark-radar-base44-local-dev-jwt-secret-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
      BASE44_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN:-}
    volumes:
      - ./:/app
      - web-node-modules:/app/node_modules
    command: ["sh", "/app/.base44/web-start.sh"]
    labels:
      base44.project: spark-radar
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 240s

volumes:
  db-data:
  web-node-modules:
